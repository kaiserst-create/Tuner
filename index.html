<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuner</title>
<meta name="description" content="Stimmgerät für Gitarre und Ukulele mit Zeiger, Referenztönen und Kammerton von 430 bis 450 Hz. Läuft offline.">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tuner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  // Thema sofort setzen, damit nichts aufblitzt
  try { var t = localStorage.getItem('tuner-thema'); if (t === 'hell' || t === 'dunkel') document.documentElement.dataset.theme = t === 'hell' ? 'light' : 'dark'; } catch (e) {}
</script>
</head>
<body>
<header class="kopf">
  <div class="marke">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="var(--akzent)"/>
      <g fill="none" stroke="var(--akzent-text)" stroke-linecap="round">
        <path d="M26 12v19a6 6 0 0 0 12 0V12M32 37v15" stroke-width="4.4"/>
        <path d="M18 17q-3.5 6 0 12M46 17q3.5 6 0 12" stroke-width="2.6" opacity=".8"/>
      </g>
    </svg>
    <div>
      <h1>Tuner</h1>
      <p class="untertitel">Stimmgerät</p>
    </div>
  </div>
  <button type="button" id="thema" class="icon-knopf" aria-label="Hell oder dunkel umschalten" title="Hell oder dunkel">
    <svg class="sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    <svg class="mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<!-- ===================================================== Stimmgerät -->
<main id="stimmgeraet" class="seite" aria-label="Stimmgerät">
  <div class="segment sg-inst" id="sg-inst" role="radiogroup" aria-label="Was stimmst du?">
    <button type="button" role="radio" data-wert="frei">Frei</button>
    <button type="button" role="radio" data-wert="gitarre">Gitarre</button>
    <button type="button" role="radio" data-wert="ukulele">Ukulele</button>
  </div>

  <div class="sg-zeile">
    <label class="feld" id="sg-stimmung-feld"><span>Stimmung</span><select id="sg-stimmung"></select></label>
    <div class="feld sg-kt-feld">
      <div class="sg-kt-kopf">
        <span>Kammerton A4</span>
        <button type="button" class="knopf zweit klein" id="sg-kt-spielen" aria-pressed="false"></button>
      </div>
      <div class="sg-kt">
        <button type="button" class="icon-knopf klein" id="sg-kt-minus" aria-label="Kammerton 1 Hz tiefer">−</button>
        <input type="range" id="sg-kt" min="430" max="450" step="1" aria-label="Kammerton in Hertz">
        <button type="button" class="icon-knopf klein" id="sg-kt-plus" aria-label="Kammerton 1 Hz höher">+</button>
        <output id="sg-kt-wert" for="sg-kt">440 Hz</output>
        <button type="button" class="knopf zweit mini" id="sg-kt-reset" hidden>auf 440</button>
      </div>
    </div>
  </div>

  <div class="karte sg-anzeige still" id="sg-anzeige">
    <svg class="sg-skala" id="sg-skala" viewBox="0 0 260 142" aria-hidden="true"></svg>
    <div class="sg-ton" id="sg-ton">–</div>
    <div class="sg-status" id="sg-status" aria-live="polite"></div>
    <div class="sg-info" id="sg-info"></div>
    <div class="sg-pegel" title="Lautstärke am Mikrofon"><i id="sg-pegel"></i></div>
    <div class="sg-saiten-feld" id="sg-saiten-feld">
      <div class="chips sg-saiten" id="sg-saiten"></div>
      <p class="leise klein-text">Tippe auf eine Saite: Du hörst ihren Ton, und das Stimmgerät achtet nur noch auf sie. „Auto“ erkennt die Saite selbst.</p>
    </div>
  </div>

  <div class="sg-mikro">
    <button type="button" class="knopf" id="sg-mikro">Mikrofon starten</button>
    <p class="leise klein-text" id="sg-hinweis"></p>
  </div>
</main>

<footer class="fuss">
  <p id="offline-status" class="leise"></p>
  <p id="install-zeile" hidden><button type="button" class="link-knopf" id="install-oeffnen">Tuner als App installieren</button></p>
</footer>

<!-- ===================================================== Hinweis zum Installieren (iPhone, iPad, Android) -->
<aside id="install-hinweis" class="install-hinweis" aria-labelledby="ih-titel" hidden>
  <img class="ih-icon" src="icons/icon.svg" alt="" width="44" height="44">
  <div class="ih-text">
    <h2 id="ih-titel">Als App installieren</h2>
    <p id="ih-nutzen"></p>
    <ol id="ih-schritte"></ol>
    <p id="ih-notiz" class="leise" hidden></p>
    <button type="button" class="knopf" id="ih-installieren" hidden>Installieren</button>
  </div>
  <button type="button" class="icon-knopf ih-zu" id="ih-zu" aria-label="Hinweis schließen" title="Schließen">×</button>
</aside>

<script src="klang.js"></script>
<script src="stimmen.js"></script>
<script src="installieren.js"></script>
<script src="app.js"></script>
</body>
</html>
